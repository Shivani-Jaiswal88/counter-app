
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOD COUNTER</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="card">

            <div class="om-symbol">ॐ</div>

            <h1>ॐ नमः शिवाय</h1>

            <div class="divider">
                <span>🔱</span>
            </div>

            <span id="value">0</span>

            <div class="btn">
                <button id="reset" aria-label="Reset counter">
                    ↻ <span>0</span>
                </button>

                <button id="increase" aria-label="Increase counter">
                    +
                </button>
            </div>

            <button id="song">♫ Play</button>

            <div class="footer-symbol">🪷</div>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
